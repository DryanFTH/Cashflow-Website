services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: production
        ports:
            - '3000:3000'
        environment:
            - NODE_ENV=production
            - DATABASE_URL=file:/app/data/production.db
        volumes:
            - cashflow_data:/app/data
        restart: unless-stopped

volumes:
    cashflow_data:
